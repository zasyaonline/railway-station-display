upstream railway_platform { server 127.0.0.1:3000; }
upstream railway_coach { server 127.0.0.1:3001; }
upstream railway_admin { server 127.0.0.1:3002; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2m;

    location = /platform { return 301 /platform/; }
    location /platform/ {
        proxy_pass http://railway_platform/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /platform;
    }

    location = /coach { return 301 /coach/; }
    location /coach/ {
        proxy_pass http://railway_coach/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /coach;
    }

    location = /admin { return 301 /admin/; }
    location /admin/ {
        proxy_pass http://railway_admin/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://railway_admin/health;
        proxy_set_header Host $host;
    }

    location /api/edge/ {
        proxy_pass http://railway_admin/api/edge/;
        proxy_set_header Host $host;
    }
    location /api/licence/ {
        proxy_pass http://railway_admin/api/licence/;
        proxy_set_header Host $host;
    }
    location /api/admin/ {
        proxy_pass http://railway_admin/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Key $http_x_admin_key;
    }
    location /api/platform/ {
        proxy_pass http://railway_platform/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Key $http_x_admin_key;
    }
    location /api/coach/ {
        proxy_pass http://railway_coach/api/coach/;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Key $http_x_admin_key;
    }
    location /api/ {
        proxy_pass http://railway_platform/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Key $http_x_admin_key;
        proxy_set_header X-Session-Id $http_x_session_id;
    }

    location /data/ {
        proxy_pass http://railway_coach/data/;
        proxy_set_header Host $host;
    }

    location /api/coach-board {
        proxy_pass http://railway_coach/api/coach-board;
        proxy_set_header Host $host;
        proxy_set_header X-Session-Id $http_x_session_id;
    }
    location /api/coach-types {
        proxy_pass http://railway_coach/api/coach-types;
        proxy_set_header Host $host;
    }
}
