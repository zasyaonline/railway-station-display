<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Position — Premium</title>
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css?v=20260824a">
  <link rel="stylesheet" href="css/premium.css?v=20260824a">
</head>
<body class="theme-premium">
  <header class="header">
    <div class="header-left">
      <img src="img/ir-logo.png" alt="Indian Railways" class="logo">
      <div>
        <h1 id="stationTitle">COACH POSITION</h1>
        <p class="subtitle" id="displayName"></p>
      </div>
    </div>
    <div class="header-right">
      <div class="clock" id="clock">--:--:--</div>
      <div class="clock-date" id="clockDate"></div>
      <div class="lang" id="langLabel">EN</div>
    </div>
  </header>

  <main class="board" id="board">
    <p class="loading" id="bootLoading">Loading coach positions…</p>
  </main>

  <footer class="footer">
    <span id="footerMeta">Coach Position</span>
    <span id="footerWindow">Window: T−10 until departure</span>
    <nav class="theme-nav" aria-label="Display options">
      <a class="theme-link" id="linkCurrentTv" href="/?station=BG&display=entrance-main">Current TV</a>
      <a class="theme-link" id="linkPremiumTv" href="/premium.html?station=BG&display=entrance-main">Premium TV</a>
      <a class="theme-link" id="linkChartView" href="/chart.html?station=BG&display=entrance-main">Chart view</a>
    </nav>
    <a class="admin-link" href="/admin.html">Admin</a>
  </footer>

  <script src="config.js"></script>
  <script src="js/i18n.js?v=20260824a"></script>
  <script src="js/app.js?v=20260824a"></script>
</body>
</html>
